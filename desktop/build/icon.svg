<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="oak-icon-title">
  <title id="oak-icon-title">Oak</title>
  <!-- Oak's app icon: the cross-section of a log, one ring a day, with a sprout growing from the heartwood.
       macOS grid: an 824 px rounded square centred on a 1024 canvas, with room for the shadow. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6b45"/>
      <stop offset="1" stop-color="#1d4a2f"/>
    </linearGradient>
    <radialGradient id="wood" cx="0.46" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#f3dcaa"/>
      <stop offset="0.7" stop-color="#e2bd7c"/>
      <stop offset="1" stop-color="#c9964f"/>
    </radialGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4a24"/>
      <stop offset="1" stop-color="#4a2a12"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd19e"/>
      <stop offset="1" stop-color="#3f9a5c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b2414" flood-opacity="0.45"/>
    </filter>
    <clipPath id="disc"><circle cx="512" cy="540" r="282"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- the log -->
  <g filter="url(#soft)">
    <circle cx="512" cy="540" r="306" fill="url(#bark)"/>
    <circle cx="512" cy="540" r="282" fill="url(#wood)"/>
  </g>

  <!-- growth rings, slightly off-centre like real wood -->
  <g clip-path="url(#disc)" fill="none" stroke="#a8743a" stroke-linecap="round">
    <ellipse cx="500" cy="530" rx="250" ry="246" stroke-width="7" stroke-opacity="0.55"/>
    <ellipse cx="497" cy="527" rx="212" ry="207" stroke-width="6" stroke-opacity="0.6"/>
    <ellipse cx="494" cy="524" rx="176" ry="170" stroke-width="7" stroke-opacity="0.62"/>
    <ellipse cx="492" cy="522" rx="141" ry="136" stroke-width="6" stroke-opacity="0.66"/>
    <ellipse cx="490" cy="520" rx="107" ry="103" stroke-width="6" stroke-opacity="0.7"/>
    <ellipse cx="489" cy="519" rx="74" ry="71" stroke-width="5" stroke-opacity="0.75"/>
    <ellipse cx="488" cy="518" rx="43" ry="41" stroke-width="5" stroke-opacity="0.8"/>
    <!-- a radial check in the wood -->
    <path d="M 640 690 L 700 760" stroke="#8a5a2b" stroke-width="6" stroke-opacity="0.5"/>
  </g>

  <!-- the newest ring, in amber: today's -->
  <circle cx="512" cy="540" r="282" fill="none" stroke="#e0a54a" stroke-width="10"/>

  <!-- the sprout from the heartwood -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M 488 520 C 486 470, 494 420, 512 372" fill="none" stroke="#2f6b45" stroke-width="16"/>
    <path d="M 506 392 C 548 330, 640 318, 690 352 C 650 410, 566 430, 506 392 Z" fill="url(#leaf)" stroke="#2f6b45" stroke-width="10"/>
    <path d="M 520 386 C 572 370, 620 362, 662 356" fill="none" stroke="#2f6b45" stroke-width="6" stroke-opacity="0.7"/>
    <path d="M 500 430 C 462 382, 392 372, 350 398 C 382 448, 452 462, 500 430 Z" fill="url(#leaf)" stroke="#2f6b45" stroke-width="10"/>
    <path d="M 488 424 C 450 412, 410 404, 372 402" fill="none" stroke="#2f6b45" stroke-width="6" stroke-opacity="0.7"/>
    <circle cx="488" cy="520" r="11" fill="#2f6b45"/>
  </g>
</svg>
