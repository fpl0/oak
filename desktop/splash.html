<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Oak</title>
    <style>
      /* The desktop app's loading screen, before the server answers. Colours are tokens.css's Night studio
         (Oak 2.0): Paper bg #f4f4f2, Bark bg #0e0e10, accent #1d7444 / #72d494. The mark is desktop/build/icon.svg. */
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center; text-align: center;
        background: #f4f4f2; color: #53535a;
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
      }
      body::before {
        content: ""; position: fixed; inset: 0 0 auto 0; height: 38px; box-sizing: border-box;
        background: #ececea; border-bottom: 1px solid #dcdcd7; -webkit-app-region: drag;
      }
      .mark { display: block; margin: 0 auto 18px; }
      .ring {
        width: 22px; height: 22px; margin: 0 auto 12px; border-radius: 50%; box-sizing: border-box;
        border: 2px solid #dcdcd7; border-top-color: #1d7444;
        animation: spin 1s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0e0e10; color: #a8a8b0; }
        body::before { background: #1d1d20; border-color: #2a2a2f; }
        .ring { border-color: #2a2a2f; border-top-color: #72d494; }
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </head>
