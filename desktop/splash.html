<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>Oak</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; height: 100vh; display: grid; place-items: center;
        background: #f6f2ea; color: #5b5146;
        font: 15px/1.5 -apple-system, system-ui, sans-serif;
      }
      body::before {
        content: ""; position: fixed; inset: 0 0 auto 0; height: 38px; box-sizing: border-box;
        background: #efe9de; border-bottom: 1px solid #ddd3c3; -webkit-app-region: drag;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #14110e; color: #b9ad9c; }
        body::before { background: #26201a; border-color: #3a3128; }
      }
      .ring {
        width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 50%;
        border: 3px solid currentColor; border-top-color: #2f6b45; opacity: .7;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
    </style>
  </head>
  <body>
    <div><div class="ring"></div>Starting Oak…</div>
  </body>
</html>
